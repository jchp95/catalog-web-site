# Deploy to CapRover on every push to main (and manual runs).
# Secrets required (Settings → Secrets and variables → Actions):
#   CAPROVER_SERVER  e.g. https://captain.apps.solva.click
#   APP_NAME         e.g. catalog-web-site
#   APP_TOKEN        CapRover app token (Deployment tab → Enable App Token)
#
# Docs: https://caprover.com/docs/ci-cd-integration/deploy-from-github.html

name: Deploy CapRover

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caprover-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify CapRover secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${{ secrets.CAPROVER_SERVER }}" ]; then echo "::error::CAPROVER_SERVER secret is empty"; missing=1; fi
          if [ -z "${{ secrets.APP_NAME }}" ]; then echo "::error::APP_NAME secret is empty"; missing=1; fi
          if [ -z "${{ secrets.APP_TOKEN }}" ]; then echo "::error::APP_TOKEN secret is empty"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # Print non-secret values so misnamed apps/URLs are obvious in the log
          echo "CAPROVER_SERVER=${{ secrets.CAPROVER_SERVER }}"
          echo "APP_NAME=${{ secrets.APP_NAME }}"
          echo "APP_TOKEN length=${#TOKEN}"
        env:
          TOKEN: ${{ secrets.APP_TOKEN }}

      - name: Create CapRover deploy.tar
        run: |
          set -euo pipefail
          tar -cf ./deploy.tar --wildcards \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./out' \
            --exclude='./.git' \
            --exclude='./.tmp' \
            --exclude='./.temp' \
            --exclude='./.claude' \
            --exclude='./.cursor' \
            --exclude='./.vscode' \
            --exclude='./.idea' \
            --exclude='./.playwright-cli' \
            --exclude='./coverage' \
            --exclude='./playwright-report' \
            --exclude='./test-results' \
            --exclude='./docs' \
            --exclude='./README.md' \
            --exclude='./AGENTS.md' \
            --exclude='./CLAUDE.md' \
            --exclude='./start-local.sh' \
            --exclude='./.DS_Store' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./deploy.tar' \
            --exclude='./local-showroom-caprover.tar' \
            --exclude='./*.tar' \
            --exclude='./*.tar.gz' \
            --exclude='./tsconfig.tsbuildinfo' \
            --exclude='./public/munich/cuts/*.png' \
            --exclude='./public/munich/lib' \
            --exclude='./public/munich/videos' \
            --exclude='./public/videos/Munich_*' \
            --exclude='./public/videos/Sneaker_*' \
            --exclude='./public/videos/munich-turntable.mp4' \
            --exclude='./public/images/munich' \
            --exclude='./public/images/munich-card.png' \
            --exclude='./public/images/pulso.png' \
            .
          ls -lh deploy.tar
          # Sanity: must include captain-definition + Dockerfile + app sources
          tar -tf deploy.tar | rg -n '^\./captain-definition$|^\./Dockerfile$|^\./package.json$|^\./features/munich/' | head -20
          bytes=$(wc -c < deploy.tar)
          echo "deploy.tar bytes=$bytes"
          if [ "$bytes" -lt 1000000 ]; then
            echo "::error::deploy.tar is suspiciously small ($bytes bytes)"
            exit 1
          fi

      # Use CLI on the runner (not the Docker action) so logs are visible and
      # ./deploy.tar from the previous step is definitely the file that uploads.
      # Note: CapRover app-token deploys do NOT stream build logs here — check
      # CapRover → App → Deployment for the real Docker build output.
      - name: Deploy to CapRover
        run: |
          set -euo pipefail
          npm install -g caprover
          test -f ./deploy.tar
          # Normalize trailing slash on server URL
          SERVER="${CAPROVER_SERVER%/}"
          echo "Deploying $(ls -lh deploy.tar | awk '{print $5}') to $SERVER app=$APP_NAME"
          caprover deploy \
            --caproverUrl "$SERVER" \
            --appToken "$APP_TOKEN" \
            --appName "$APP_NAME" \
            --tarFile ./deploy.tar
          echo "Upload accepted. Open CapRover → $APP_NAME → Deployment to watch the build."
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
