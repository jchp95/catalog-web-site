# Build the Docker image in GitHub Actions, then tell CapRover to pull it.
# Building on CapRover fails under load with BuildKit
# "no active session / context deadline exceeded" (large Munich frame context).
#
# Secrets (Repository secrets, Environment: production):
#   CAPROVER_SERVER  = https://captain.apps.solva.click
#   APP_NAME         = catalog-web-site
#   APP_TOKEN        = CapRover app Deployment token
#
# CapRover must be able to pull from GHCR (same registry it already pushes to).

name: Deploy CapRover

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caprover-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve CapRover config
        id: cfg
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          set -euo pipefail
          SERVER="${CAPROVER_SERVER:-${CAPROVER_URL:-${SERVER_URL:-}}}"
          APP="${APP_NAME:-${CAPROVER_APP:-}}"
          TOKEN="${APP_TOKEN:-${CAPROVER_APP_TOKEN:-}}"
          SERVER="${SERVER%/}"

          if [ -z "$SERVER" ] || [ -z "$APP" ] || [ -z "$TOKEN" ]; then
            echo "::error::Missing CapRover secrets (CAPROVER_SERVER, APP_NAME, APP_TOKEN)."
            echo "Detected lengths: SERVER=${#SERVER} APP=${#APP} TOKEN=${#TOKEN}"
            exit 1
          fi

          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/catalog-web-site"
          TAG="${{ github.sha }}"

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using CAPROVER_SERVER=$SERVER APP_NAME=$APP IMAGE=$IMAGE:$TAG"

      - name: Verify Munich frames are present
        run: |
          set -euo pipefail
          desktop=$(find public/frames/munich-yellow/desktop -name 'frame_*.png' | wc -l | tr -d ' ')
          explod=$(find public/frames/munich-yellow/explod -name 'frame_*.png' | wc -l | tr -d ' ')
          color=$(find public/frames/munich-yellow/colorways -name 'frame_*.png' | wc -l | tr -d ' ')
          echo "frames: desktop=$desktop explod=$explod colorways=$color"
          if [ "$desktop" -lt 120 ] || [ "$explod" -lt 96 ] || [ "$color" -lt 96 ]; then
            echo "::error::Missing Munich frame plates"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.tag }}
            ${{ steps.cfg.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (CapRover pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CapRover pulls without our GITHUB_TOKEN; public package avoids 401.
          # If this fails (org policy), configure CapRover Cluster → Registries instead.
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/catalog-web-site/visibility" \
            -f visibility=public \
            || gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${{ github.repository_owner }}/packages/container/catalog-web-site/visibility" \
              -f visibility=public \
            || echo "Could not set package visibility; ensure CapRover can pull GHCR."

      - name: Deploy image to CapRover
        env:
          CAPROVER_SERVER: ${{ steps.cfg.outputs.server }}
          APP_NAME: ${{ steps.cfg.outputs.app }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.tag }}
        run: |
          set -euo pipefail
          TOKEN="${APP_TOKEN:-${CAPROVER_APP_TOKEN:-}}"
          npm install -g caprover
          echo "Deploying pre-built $IMAGE → $CAPROVER_SERVER / $APP_NAME (pull only, no CapRover build)"
          caprover deploy \
            --caproverUrl "$CAPROVER_SERVER" \
            --appToken "$TOKEN" \
            --appName "$APP_NAME" \
            --imageName "$IMAGE"
